# Prólogo — "Maré Vazia"
# Todas as cenas têm as personagens em palco (Inês, Chefe Joaquim, Avó Celeste) com expressões dinâmicas.

- scene: prologo_comboio
  title: "Comboio Regional · Linha do Oeste"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_comboio.webp
  music: tema_ines
  ambient: comboio
  lines:
    - chapterCard:
        number: "PRÓLOGO"
        title: "Maré Vazia"
        quote: "«Há terras onde o mar leva os barcos, e terras onde leva os nomes.»"
        image: ./assets/bg/cap_prologo.webp

    - sprite: ines
      expr: neutra
      pos: left
    - text: "O comboio regional abranda sempre antes da curva do pinhal, como se também tivesse dúvidas sobre se vale a pena chegar."
    - text: "Encosto a testa ao vidro frio. {pause:450}Lá fora não há pinhal nenhum — só uma parede de névoa cor de chumbo que engoliu os postes telegráficos um a um."
    - who: ines
      expr: ironica
      text: "*Dez anos. Três mil seiscentos e cinquenta dias a prometer que não voltava a pôr os pés nesta linha.*"
    - who: ines
      expr: neutra
      text: "No meu colo, entre as páginas do caderno preto, está o postal da avó Celeste."
    - text: "Não tem selo. Alguém o meteu diretamente na minha caixa do correio em Lisboa, ou então os carteiros da costa ainda obedecem à minha avó mais do que aos regulamentos."
    - text: "Sete palavras a tinta azul, escritas com a mão trémula de quem segura uma lanterna contra o vento:"
    - text: "**«Vem. Antes da próxima maré. — Avó.»**"
    - set:
        memoriasRecolhidas: +1
        flag.mem_postal_celeste: true
    - text: "Passo o polegar pelo cartão húmido. O papel sabe a sal."
    - who: ines
      expr: triste
      text: "*Em alemão há a palavra **Fernweh** — a dor de querer estar longe, a saudade de um sítio onde nunca fomos.*"
      word: fernweh
    - who: ines
      expr: neutra
      text: "*Para a dor de voltar ao sítio de onde fugimos às seis da manhã sem olhar para trás, ainda não encontrei tradução em língua nenhuma.*"

    - choice:
        prompt: "O comboio apita ao longe. O que faço com o postal?"
        options:
          - text: "Dobrá-lo dentro do caderno, junto à primeira página."
            remember: true
            set:
              confiancaCeleste: +1
              coragem: +1
              flag.guardouPostal: true
            lines:
              - text: "Abro o caderno na primeira folha — aquela onde escrevi *saudade* aos dezanove anos, com a letra torta do solavanco das carruagens."
              - text: "Prendo o postal no elástico. Se a avó me chamou ao fim de uma década de silêncio teimoso, não foi para falar do tempo."
          - text: "Metê-lo no fundo do bolso do casaco e fechar o caderno."
            set:
              negacao: +1
            lines:
              - text: "Empurro o postal para o fundo do bolso, onde ficam os bilhetes antigos e as moedas que ninguém usa."
              - who: ines
                expr: ironica
                text: "*Vinte e quatro horas. Vejo como ela está, deixo a despensa cheia, apanho o regional de amanhã às sete.*"
          - text: "Cheirar o papel outra vez, a tentar lembrar-me do cheiro da cozinha do farol."
            remember: true
            set:
              coragem: +1
              flag.cheirouPostal: true
            lines:
              - who: ines
                expr: triste
                text: "Fecho os olhos. Debaixo do sal há lúcia-lima seca, petróleo de candeeiro e lã guardada em arcas de cânfora."
              - text: "Por um segundo, sinto nos lábios um gosto a maresia tão vivo que quase digo um nome em voz alta. {pause:500}Mas a palavra desfaz-se antes de chegar à língua."

    - sfx: bell
      caption: "[Campainha metálica da passagem de nível]"
      text: "Os travões chiaram contra o carril molhado. Uma voz gravada tenta anunciar a paragem, falha a meio e desiste num estalido."
    - goto: prologo_estacao

- scene: prologo_estacao
  title: "Apeadeiro de Névoa"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_estacao.webp
  music: tema_ines
  ambient: mar_vento
  lines:
    - bg: ./assets/bg/bg_estacao.webp
      transition: fade
    - sprite: ines
      expr: neutra
      pos: left
    - text: "Saio sozinha para a plataforma. A porta pneumática fecha-se atrás de mim com um sopro curto e o comboio desaparece no branco antes mesmo de chegar ao fim do cais."
    - text: "O ar de Névoa não se respira — bebe-se. É frio, espesso, cheio de gotículas que ficam presas nas pestanas."
    - text: "Olho para a placa de azulejos por cima do banco de madeira. Onde devia estar o nome da terra, a cal foi passada por cima das letras azuis."
    - sprite: joaquim
      expr: sorriso
      pos: right
    - who: joaquim
      name: "Chefe da Estação"
      text: "Menina Inês? {pause:350}Credo, és mesmo tu! Olha para este milagre!"
    - text: "O senhor Joaquim sai da bilheteira com um boné dois números acima da cabeça e um sorriso tão largo que lhe repuxa as faces."
    - who: ines
      expr: neutra
      text: "Boa tarde, senhor Joaquim. Ainda cá está a guardar os horários?"
    - who: joaquim
      expr: sorriso
      text: "E que remédio, rapariga! Mas aqui ninguém tem pressa. Vens visitar a tua avó? Grande mulher, a dona Celeste. Forte como um rochedo."
    - who: ines
      expr: neutra
      text: "Mandou-me um postal. Disse para vir antes da próxima maré."
    - sprite: joaquim
      expr: neutra
      pos: right
    - text: "O sorriso do senhor Joaquim não diminui — congela. Os olhos dele continuam muito abertos, muito claros, fixos no meu cachecol."
    - who: joaquim
      expr: sorriso
      text: "A maré? {pause:400}Ora, a tua avó sempre gostou de falar por enigmas, pá. Aqui o tempo é uma bênção. Não há cá marés más."
    - who: ines
      expr: ironica
      text: "Lembro-me das tempestades de novembro partirem o paredão ao meio, senhor Joaquim."
    - who: joaquim
      expr: neutra
      text: "Tempestades? {pause:400}Estás confundida com Lisboa, menina. Névoa foi eleita a vila mais feliz do país há quatro anos. Temos placa na rotunda e tudo!"
    - who: ines
      expr: triste
      text: "*Ele diz aquilo no mesmo tom em que um médico garante que não vai doer nada.*"
    - who: joaquim
      expr: sorriso
      text: "Vai pela rua de cima, que tem os candeeiros acesos. Não te metas pelo carreiro das dunas a esta hora, que o cacimbo molha os ossos."
    - sprite: joaquim
      hide: true

    - choice:
        prompt: "O caminho divide-se à saída do apeadeiro."
        options:
          - text: "Subir pela rua principal da vila, como ele aconselhou."
            goto: prologo_rua
          - text: "Cortar pelo carreiro das dunas, junto à rebentação."
            remember: true
            set:
              coragem: +1
              flag.viuPegadas: true
            goto: prologo_dunas

- scene: prologo_dunas
  title: "O Carreiro das Dunas"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/cap_prologo.webp
  music: tema_mara
  ambient: mar_vento
  lines:
    - bg: ./assets/bg/cap_prologo.webp
      transition: brush
    - sprite: ines
      expr: neutra
      pos: left
    - text: "Ignoro o conselho e desço pelo passadiço partido que dá às dunas. A mala bate nos degraus de madeira húmida."
    - text: "Aqui em baixo o mar ouve-se antes de se ver: uma respiração funda, arrastada na vasa da maré vazia."
    - text: "Um barco de madeira encalhado inclina-se na areia escura, como um animal adormecido. Não há redes a secar. Não há gaivotas."
    - who: ines
      expr: surpresa
      text: "Paro junto à linha de espuma. {pause:500}Na areia molhada, acabadas de fazer, há pegadas pequenas."
    - who: ines
      expr: triste
      text: "*Pés descalços. Tamanho de uma criança de oito ou nove anos.*"
    - text: "As pegadas saem da água gelada, dão duas voltas em redor de um montinho de conchas partidas e param a três passos dos meus sapatos."
    - text: "Não há pegadas de regresso."
    - sfx: foghorn
      caption: "[Trompa de nevoeiro grave ao longe]"
      effect: pulse
      text: "Ao longe, na ponta do cabo, a trompa do farol solta um gemido rouco que faz vibrar a fivela da minha mala."
    - who: ines
      expr: surpresa
      text: "Está aí alguém?"
    - text: "Só o estalar da espuma a rebentar nos seixos. {pause:400}Subo a encosta de estorno de volta à calçada, com o coração a bater depressa demais para quem só subiu uma duna."
    - goto: prologo_rua

- scene: prologo_rua
  title: "Rua dos Navegantes"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_rua_nevoa.webp
  music: tema_vila
  ambient: mar_vento
  lines:
    - bg: ./assets/bg/bg_rua_nevoa.webp
      transition: fade
    - sprite: ines
      expr: neutra
      pos: left
    - text: "A Rua dos Navegantes sobe a encosta entre casas caiadas de fresco e barras pintadas de azul-ultramarino."
    - text: "Cheira a caldo verde e a lenha de pinho. Pelas janelas entreabertas ouvem-se pratos a tilintar e risos — muitos risos, leves, sem pressa."
    - text: "Demoro três quarteirões a perceber o que me está a incomodar."
    - who: ines
      expr: surpresa
      text: "*Os bancos de pedra.*"
    - text: "Ao longo de todo o miradouro da calçada, os bancos de granito foram chumbados de novo ao chão. Estão todos virados para as fachadas das casas — de costas voltadas para o oceano."
    - text: "E nas paredes que dão para o poente, todas as portadas de madeira estão trancadas a ferro, embora ainda não sejam sete da tarde."
    - if: viuPegadas
      then:
        - who: ines
          expr: triste
          text: "*Pegadas descalças na vasa lá em baixo, e cá em cima novecentas pessoas que fecharam as janelas ao mar.*"
      else:
        - who: ines
          expr: ironica
          text: "*Uma vila piscatória que finge que o Atlântico é um vizinho mal-educado a quem se deixa de falar.*"
    - text: "No fim da calçada, onde o empedrado acaba e começa o cascalho do promontório, a névoa abre-se num rasgão vertical."
    - goto: prologo_farol_vista

- scene: prologo_farol_vista
  title: "Promontório do Farol"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_rua_nevoa.webp
  music: tema_farol
  ambient: mar_vento
  lines:
    - sprite: ines
      hide: true
    - cg: ./assets/cg/cg_primeiro_farol.webp
      caption: "Primeira visão do Farol de Névoa"
    - text: "Ali está ele."
    - text: "A torre ergue-se sobre a escarpa negra, muito mais alta do que a memória que eu levava dobrada na carteira."
    - text: "Lá em cima, atrás dos prismas da lente de Fresnel, o feixe amarelo roda devagar, cortando o nevoeiro como uma lâmina morna."
    - sfx: memory
      effect: beamFlicker
      text: "Quando a luz passa sobre a minha cara, a chama lá dentro treme. {pause:350}Pisca uma vez. {pause:250}Duas. {pause:250}Três."
    - text: "Levo a mão à boca sem querer. Os meus lábios sabem a sal grosso, como se tivesse acabado de chorar."
    - who: ines
      text: "*Porque é que eu fui embora daqui a correr, mesmo?*"
    - text: "Tento puxar o fio dessa manhã de setembro de 2016: lembro-me do bilhete na mão, da mala mal fechada, do sol a nascer atrás dos eucaliptos."
    - text: "Mas quando tento lembrar-me da véspera — da noite anterior ao comboio —, a minha cabeça devolve apenas o barulho do vento e uma frase da minha avó:"
    - text: "*«Nas noites de tempestade, fecha os olhos quando a luz passar.»*"
    - cg: null
    - goto: prologo_cozinha

- scene: prologo_cozinha
  title: "Cozinha do Farol"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_cozinha_farol.webp
  music: tema_celeste
  ambient: cozinha
  lines:
    - bg: ./assets/bg/bg_cozinha_farol.webp
      transition: fade
    - sprite: ines
      expr: neutra
      pos: left
    - text: "A porta da casa do faroleiro nunca teve chave pelo lado de fora. Basta levantar o trinco de ferro dois dedos para não chiar."
    - text: "Assim que entro na cozinha, os dez anos encolhem até caberem numa casca de noz."
    - text: "O fogão de lenha estala. Sobre o oleado aos quadrados estão duas canecas desencontradas e um bule de esmalte azul."
    - sprite: celeste
      expr: neutra
      pos: right
    - text: "A avó Celeste está de pé junto ao armário da louça, com o casaco de lã cru e o xaile preto pelos ombros. Ao pescoço, no cordel de couro, brilha a chave de latão da lanterna."
    - text: "Na mão direita tem uma **terceira chávena** — mais pequena, com o bordo lascado."
    - sprite: celeste
      expr: surpresa
      pos: right
    - text: "Quando me ouve pousar a mala, volta-se. Por meio segundo, os olhos escuros dela procuram alguém atrás do meu ombro, à altura da minha cintura."
    - sprite: celeste
      expr: evasiva
      pos: right
    - text: "Depois pousa a terceira chávena dentro do armário, fecha a portinhola de vidro e recompõe o rosto."
    - sprite: celeste
      expr: sorriso
      pos: right
    - who: celeste
      text: "Chegaste no comboio das seis. {pause:350}Estás mais magra, Inês. Em Lisboa não vendem pão de jeito?"
    - who: ines
      expr: ironica
      text: "Dez anos sem nos vermos, avó, e a primeira palavra é sobre padarias."
      word: abracadouro
    - sprite: celeste
      expr: neutra
      pos: right
    - who: celeste
      text: "Se te dissesse que tive saudades, ficavas já desconfiada no abraçadouro da porta e não tiravas o casaco."

    - choice:
        prompt: "A avó segura o bule com as duas mãos para esconder o tremor nos dedos."
        options:
          - text: "Atravessar a cozinha e abraçá-la sem dizer nada."
            remember: true
            set:
              confiancaCeleste: +1
              coragem: +1
              flag.abracouAvo: true
            lines:
              - effect: focus
                text: "Dou três passos largos e envolvo-a nos braços. Ela é mais pequena do que eu me lembrava — os ossos dos ombros parecem vimes secos debaixo da lã."
              - sprite: celeste
                expr: triste
                pos: right
              - text: "Durante dois segundos ela fica hirta, surpreendida. Depois encosta o queixo ao meu cachecol e aperta-me as costas com uma força antiga."
              - who: celeste
                text: "Pronto, rapariga. {pause:400}Já cá estás. Já não estou sozinha a ouvir o vento."
              - effect: clearFocus
                text: "Quando nos separamos, ela limpa as mãos ao avental como se tivesse deixado cair farinha."
          - text: "Perguntar de quem era a terceira chávena que ela guardou no armário."
            remember: true
            set:
              coragem: +1
              flag.perguntouChavena: true
            lines:
              - who: ines
                expr: neutra
                text: "Estavas à espera de mais alguém? Vi três chávenas na tua mão."
              - sprite: celeste
                expr: evasiva
                pos: right
              - who: celeste
                text: "Velhice, filha. As mãos têm memória própria — tiram da prateleira o que tiravam noutros tempos."
              - who: ines
                expr: triste
                text: "De quem era a chávena pequena, avó?"
              - sprite: celeste
                expr: seria
                pos: right
              - who: celeste
                text: "De ninguém que o chá quente aqueça agora. Senta-te e bebe antes que arrefeça."
          - text: "Tirar o postal do bolso e pousá-lo em cima do oleado."
            set:
              confiancaCeleste: +1
            lines:
              - who: ines
                expr: neutra
                text: "Escreveste «Vem antes da próxima maré». O que é que está para acontecer, avó?"
              - sprite: celeste
                expr: seria
                pos: right
              - who: celeste
                text: "Vem aí temporal de sudoeste, daqueles de três dias. Dos grandes. E eu tenho setenta e oito anos e um coração que falha degraus na escada."

    - sprite: celeste
      expr: neutra
      pos: right
    - text: "Pela janela estreita da cozinha, o feixe amarelo do farol varre a escuridão lá fora a cada seis segundos — *luz, sombra, luz, sombra* — como um metrónomo luminoso."
    - who: ines
      expr: neutra
      text: "O senhor Joaquim na estação disse-me que em Névoa já não há tempestades. E os bancos da rua estão todos virados de costas para o mar."
    - sprite: celeste
      expr: triste
      pos: right
    - who: celeste
      text: "O Joaquim é um homem feliz, Inês. Não lhe queiras mal por isso."
    - who: ines
      expr: ironica
      text: "Feliz? Parecia um ator a repetir uma fala decorada."
    - sprite: celeste
      expr: seria
      pos: right
    - who: celeste
      text: "Mais vale parecer ator do que entrar pelo mar dentro de madrugada com pedras nos bolsos, como faziam no tempo da minha bisavó."
    - text: "O silêncio cai entre nós, preenchido apenas pelo ferver baixinho da chaleira no ferro do fogão."
    - who: ines
      expr: surpresa
      text: "Do que é que estás a falar, Celeste?"
    - sprite: celeste
      expr: neutra
      pos: right
    - who: celeste
      text: "Hoje não. Vieste de viagem e tens olheiras de quem traduz livros até às quatro da manhã. {pause:400}Amanhã vais à vila, falas com o Duarte no cais e com a Graça na boticária. Vês com os teus olhos."
    - sprite: celeste
      expr: seria
      pos: right
    - who: celeste
      text: "Só te peço uma coisa esta noite, Inês. A mesma de quando eras pequena."
    - who: ines
      expr: neutra
      text: "Não me digas que ainda dizes isso."
    - who: celeste
      text: "**Se a luz lá em cima piscar três vezes, fecha os olhos até o feixe passar.** Não olhes para a lanterna pela janela do quarto."
    - sprite: celeste
      hide: true
    - text: "Ela pega no candeeiro a óleo do aparador, pousa-me uma mão morna no pulso e indica o corredor de madeira."
    - goto: prologo_quarto

- scene: prologo_quarto
  title: "Quarto de Infância"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_quarto_infancia.webp
  music: tema_quarto
  ambient: mar_vento
  lines:
    - bg: ./assets/bg/bg_quarto_infancia.webp
      transition: tear
    - sprite: ines
      expr: neutra
      pos: left
    - text: "O meu quarto de infância fica no piso de cima, mesmo por baixo da base de alvenaria da torre."
    - text: "Abro a porta e o cheiro a alfazema antiga mistura-se com o sal que entra pelas frinchas da caixilharia."
    - text: "A luz do farol atravessa a janela a meio e divide o soalho em duas metades."
    - text: "À esquerda está a minha cama de ferro, feita de lavado com a colcha de retalhos que a minha mãe coseu antes do acidente na estrada."
    - text: "À direita, encostada à parede onde o feixe amarelo bate em cheio, está **uma segunda cama**."
    - text: "Tem o colchão às riscas nu, sem lençóis nem almofada."
    - who: ines
      expr: surpresa
      text: "*Duas camas. {pause:450}Porque é que o meu quarto tem duas camas, se eu cresci cá sozinha com a avó?*"
      word: mono_no_aware
    - sprite: ines
      hide: true

    - hotspotScene:
        prompt: "Examina o quarto antes de te deitares (clica nos 3 pontos de memória para recordar)."
        continueGoto: prologo_quarto_noite
        hotspots:
          - id: mem_cama_vazia
            x: 72
            y: 64
            title: "A Cama Sem Lençóis"
            lines:
              - text: "Aproximo-me da cama da direita e passo os dedos pela cabeceira de madeira."
              - text: "Há um entalhe pequeno no verniz — três riscos paralelos feitos com um canivete ou uma concha afiada."
              - who: ines
                text: "*A mola do estrado range exatamente no sítio onde alguém costumava ajoelhar-se para espreitar pela janela.*"
              - text: "Uma pontada fina atravessa-me as têmporas. Lembro-me de estender um cobertor azul por cima de uns ombros estreitos... mas quando tento ver a cara na almofada, só vejo o padrão das riscas do colchão."

          - id: mem_desenho_barco
            x: 28
            y: 26
            title: "Os Desenhos na Parede"
            lines:
              - text: "Na parede caiada estão folhas de papel presas com fita-cola ressequida."
              - text: "São desenhos a lápis de cera: barcos de pesca azuis e um sol enorme sobre a água."
              - who: ines
                text: "*«Para o mar ter onde brincar antes de deitar a torre abaixo.»*"
              - text: "Congelo. Disse a frase em voz alta sem saber de onde veio. No canto inferior do papel, onde as crianças assinam o nome, a folha foi raspado até abrir buraco."

          - id: mem_buzio_janela
            x: 70
            y: 27
            title: "As Conchas e o Búzio na Prateleira"
            lines:
              - text: "Na prateleira de madeira junto à janela está um búzio branco do tamanho de um punho fechado."
              - text: "A superfície está húmida. Junto a ele há grãos de areia escura — areia da maré vazia de hoje."
              - text: "Encosto o búzio ao ouvido. {pause:450}Em vez do ruído oco do sangue, parece-me ouvir uma respiração curta e um riso abafado de criança."

- scene: prologo_quarto_noite
  title: "Quarto de Infância · Meia-Noite"
  chapter: "Prólogo"
  palette: prologo
  bg: ./assets/bg/bg_quarto_infancia.webp
  music: tema_mara
  ambient: mar_vento
  lines:
    - sprite: ines
      expr: neutra
      pos: left
    - text: "Sento-me na beira da cama feita, com o caderno aberto nos joelhos."
    - text: "Lá fora a névoa subiu até à altura do primeiro andar. Já não se vê a vila nem a linha da rebentação — apenas o feixe amarelo a girar no vazio branco."
    - sfx: knock3
      caption: "[Três batidas secas no vidro: toc... toc... toc]"
      effect: shake
      text: "*Toc. {pause:320}Toc. {pause:320}Toc.*"
    - who: ines
      expr: surpresa
      text: "O som vem diretamente da janela do primeiro andar — a cinco metros do chão de rocha."
    - text: "Não foi um ramo. Aqui em cima não há árvores. Foi o nó de um dedo a bater três vezes no vidro embaciado, num ritmo que o meu corpo inteiro reconhece antes da minha cabeça."
    - text: "Na vidraça húmida, pelo lado de fora, está a marca pequena da palma de uma mão."

    - choice:
        prompt: "O feixe do farol começa a rodar na direção da janela."
        timeoutMs: 12000
        defaultIndex: 1
        options:
          - text: "Abrir a janela e chamar na escuridão."
            remember: true
            set:
              coragem: +1
              flag.ouviuBatidas: true
              flag.abriuJanelaPrologo: true
            lines:
              - text: "Rodo o fecho de ferro emperrado e empurro as portadas contra o vento salgado."
              - who: ines
                expr: surpresa
                text: "Quem está aí?!"
              - text: "Lá em baixo, no carreiro entre as dunas e o muro do farol, um vulto pequeno de vestido azul-acinzentado está parado de pés descalços na erva molhada."
              - text: "O feixe da lanterna passa por cima dela — e a rapariga **não projeta sombra nenhuma** no chão."
          - text: "Pousar a minha mão no vidro, exatamente sobre a marca lá de fora."
            remember: true
            set:
              coragem: +1
              flag.ouviuBatidas: true
              flag.tocouVidroPrologo: true
            lines:
              - text: "Encosto a palma aberta ao vidro gelado. Os dedos lá de fora são metade do tamanho dos meus."
              - text: "O frio atravessa a vidraça como um choque elétrico — e, num clarão de meio segundo, vejo uns olhos castanhos muito abertos a rirem para mim do outro lado da chuva."
              - who: ines
                expr: triste
                text: "*«Três batidas é o código.»*"
          - text: "Recuar até à cama e fechar os olhos, como a avó pediu."
            remember: true
            set:
              negacao: +1
              confiancaCeleste: +1
              flag.fechouOlhosPrologo: true
            lines:
              - text: "Dou um passo atrás, aperto o casaco contra o peito e fecho os olhos com força quando o clarão amarelo da lanterna inunda o quarto."
              - text: "No escuro das pálpebras, ouço o vidro vibrar mais uma vez — quase um suspiro encostado à madeira."

    - sfx: memory
      effect: beamFlicker
      text: "Lá no alto da torre, a grande lente de Fresnel estremece nos carris de mercúrio."
    - who: luz
      text: "*pediram-me para guardar a paz / porque trouxeste o sal de volta*"
    - who: ines
      expr: triste
      text: "Abro o caderno na primeira página. Debaixo da palavra **saudade**, escrita há dez anos, a minha mão acrescenta uma linha sem tremer:"
    - text: "**«Em Névoa há uma cama sem lençóis, uma terceira chávena no armário e alguém que sabe o código da minha janela.»**"
    - who: ines
      expr: neutra
      word: hiraeth
      text: "Amanhã de manhã desço ao cais. Nem que tenha de virar todos os bancos da vila de frente para o mar."

    - ending:
        id: prologo_concluido
        code: "FIM DO PRÓLOGO"
        title: "Maré Vazia — Concluído"
        subtitle: "Prólogo completo validado."
        finalParagraph: "Lá fora, o feixe do farol volta a rodar sobre as águas escuras de Névoa. Podes rever o Caderno de Palavras, explorar a Galeria, testar o Histórico/Rewind ou regressar ao menu principal."
